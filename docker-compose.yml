services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATA_DIR: /data
      DATABASE_URL: postgres://edf:edf@postgres:5432/edf?sslmode=disable
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_SAMPLE_CHARS: ${LLM_MAX_SAMPLE_CHARS:-12000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-2097152}
      STORAGE: ${STORAGE:-}
    volumes:
      - ./private/data:/data

  postgres:
    image: postgres:16.1-bookworm
    profiles: ["db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edf}
      POSTGRES_DB: ${POSTGRES_DB:-edf}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-edf} -d $${POSTGRES_DB:-edf}"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
